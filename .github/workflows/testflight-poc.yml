name: External TestFlight POC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-testflight-poc
  cancel-in-progress: false

jobs:
  distribute:
    # Signing secrets must only be available to trusted code on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 210
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TESTFLIGHT_GROUP_NAME: ${{ vars.TESTFLIGHT_GROUP_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Offline distribution safety tests
        run: python3 -m unittest discover -s Scripts/testflight -p 'test_*.py'

      - name: Validate configuration and reserve build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TESTFLIGHT_TESTERS_JSON: ${{ secrets.TESTFLIGHT_TESTERS_JSON }}
        run: python3 Scripts/testflight/ci.py prepare

      - name: Archive and export signed IPA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: python3 Scripts/testflight/ci.py build

      - name: Upload IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 Scripts/testflight/ci.py upload

      - name: Wait for processing and configure external distribution
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTFLIGHT_TESTERS_JSON: ${{ secrets.TESTFLIGHT_TESTERS_JSON }}
        run: python3 Scripts/testflight/ci.py distribute

      - name: Remove temporary signing and API credentials
        if: always()
        run: python3 Scripts/testflight/ci.py cleanup

      - name: Distribution summary
        if: always()
        env:
          TF_JOB_STATUS: ${{ job.status }}
        run: python3 Scripts/testflight/ci.py summary
