name: TestFlight reservation recovery

on:
  workflow_dispatch:
    inputs:
      reservation_id:
        description: Reservation ID from the affected run summary (run_id.attempt)
        required: true
        type: string
      resolution:
        description: Completed after finishing distribution in Apple, or skipped after confirming no upload remains in flight
        type: choice
        options: [completed, skipped]
        required: true
      checked_apple:
        description: I checked Apple and finished or canceled the affected workflow; this reservation can be reconciled
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted recovery code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve an uncertain reservation
        env:
          GH_TOKEN: ${{ github.token }}
          TF_RECOVERY_ID: ${{ inputs.reservation_id }}
          TF_RECOVERY_RESOLUTION: ${{ inputs.resolution }}
          TF_RECOVERY_CONFIRMED: ${{ inputs.checked_apple }}
        run: python3 Scripts/testflight/reservations.py recover
      - name: Recovery summary
        if: always()
        env:
          TF_JOB_STATUS: ${{ job.status }}
        run: python3 Scripts/testflight/ci.py summary
